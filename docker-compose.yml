services:
  postgres:
    image: postgres:16
    container_name: nepse_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nepse
      POSTGRES_PASSWORD: nepse123
      POSTGRES_DB: nepse_stock
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: nepse_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  postgres_data: